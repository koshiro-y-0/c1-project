{% extends 'base.html' %}

{% block title %}新規サイト作成 - WebQ{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center gap-4">
                <a href="{% url 'sites:site_list' user_id=user.id %}"
                   class="text-gray-600 hover:text-gray-900">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <h1 class="text-2xl font-bold text-gray-900">新規サイト作成</h1>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <form method="post" action="{% url 'sites:site_create' user_id=user.id %}">
                {% csrf_token %}

                <div class="mb-6">
                    <label for="title" class="block text-sm font-medium text-gray-700 mb-2">
                        サイトタイトル
                    </label>
                    <input type="text"
                           id="title"
                           name="title"
                           required
                           placeholder="例: My Website"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <p class="mt-1 text-sm text-gray-500">
                        サイトの名前を入力してください（後から変更できます）
                    </p>
                </div>

                <div class="flex gap-4">
                    <a href="{% url 'sites:site_list' user_id=user.id %}"
                       class="flex-1 text-center bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition-colors">
                        キャンセル
                    </a>
                    <button type="submit"
                            class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        作成する
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>
{% endblock %}
