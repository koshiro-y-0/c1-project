{# Top セクション コンポーネント - ヒーロー画像 #}
<section id="top" class="section-style"
         style="background-color: {{ style.background_color|default:'#FFFFFF' }};
                color: {{ style.text_color|default:'#000000' }};
                font-family: '{{ style.font_family|default:'Noto Sans JP' }}', sans-serif;">

    {% if top_section and top_section.hero_image %}
    <!-- Hero Image -->
    <div class="w-full h-64 sm:h-80 md:h-96 lg:h-[500px] relative overflow-hidden">
        <img src="{{ top_section.hero_image.url }}"
             alt="{{ site.title }}"
             class="w-full h-full object-cover">
        <!-- Optional Overlay -->
        <div class="absolute inset-0 bg-black/10"></div>
    </div>
    {% else %}
    <!-- Placeholder -->
    <div class="w-full h-64 sm:h-80 md:h-96 lg:h-[500px] bg-gray-200 flex items-center justify-center">
        <div class="text-center px-4">
            <svg class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <p class="text-gray-500 text-sm sm:text-base">ヒーロー画像が設定されていません</p>
        </div>
    </div>
    {% endif %}
</section>
